<script>
  // Start the data request first thing and download every module in parallel
  // with it. Before, the modules were fetched one after another and only once
  // the data had arrived, so each one cost a full round trip on the critical
  // path. The bootstrap at the end of <body> runs them in order from the cache.
  // A 401 means there is no session (or it expired): go to the login page.
  (function () {
    // Paint the boot screen in the saved theme, not a light flash for dark users.
    try {
      var saved = JSON.parse(localStorage.getItem('zm_state_v3') || '{}');
      if (saved.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) { /* storage blocked: keep light */ }
    var V = 44; // cache-bust for assets
    window.ASSET_V = V;
    window.APP_MODULES = [
      'assets/store.js', 'assets/ui.js', 'assets/views-overview.js', 'assets/views-platforms.js',
      'assets/views-pages.js', 'assets/views-plan.js', 'assets/views-settings.js', 'assets/views-users.js',
      'assets/views-upload.js', 'assets/views-costs.js', 'assets/views-reconcile.js', 'assets/views-connect.js',
      'assets/app.js'
    ].map(function (m) { return m + '?v=' + V; });
    window.APP_MODULES.forEach(function (src) {
      var l = document.createElement('link');
      l.rel = 'preload'; l.as = 'script'; l.href = src;
      document.head.appendChild(l);
    });
    // Ordered loader shared with app.js (Chart.js is loaded on demand).
    window.loadScripts = function (srcs) {
      return Promise.all(srcs.map(function (src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = src; s.async = false; // download in parallel, run in order
          s.onload = resolve;
          s.onerror = function () { reject(new Error('Lỗi tải script: ' + src)); };
          document.head.appendChild(s);
        });
      }));
    };
    window.DASH_P = fetch('api/v2-data.php', { credentials: 'same-origin' }).then(function (r) {
      if (r.status === 401) { window.location.replace('login.html'); return new Promise(function () {}); }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  })();
</script>

<script>
  // i18n.js loads synchronously above — t() must be available before any view
  // IIFE runs. Apply translations to the static markup immediately so the
  // initial paint doesn't flash Vietnamese when the user prefers English.
  if (window.I18n) window.I18n.applyDom();
</script>
<script>
  // Bootstrap: the modules (store.js / views-*.js / app.js) read window.DASH at
  // IIFE time, so they run only after the data request (started in <head>) has
  // resolved — they were already downloading in parallel with it.
  (function () {
    var root = document.getElementById('pageRoot');
    // The boot screen is already painted (static markup in #pageRoot). If the
    // wait drags on, show a usage tip under it and rotate it until App.init
    // replaces the screen.
    var tipEl = document.getElementById('bootTip'), tipN = 0, TIPS = 5;
    function nextTip() {
      if (!document.body.contains(tipEl)) return clearInterval(tipTimer);
      tipEl.classList.remove('on');
      setTimeout(function () {
        tipEl.textContent = window.t ? window.t('boot.tip.' + (tipN++ % TIPS + 1)) : '';
        tipEl.classList.add('on');
      }, 400);
    }
    var tipTimer = setTimeout(function () { nextTip(); tipTimer = setInterval(nextTip, 4000); }, 1200);
    window.DASH_P
      .then(function (data) {
        window.DASH = data;
        return window.loadScripts(window.APP_MODULES);
      })
      .then(function () {
        if (!window.App || typeof window.App.init !== 'function') {
          throw new Error(window.t ? window.t('boot.app_missing') : 'window.App.init missing');
        }
        window.App.init();
      })
      .catch(function (err) {
        var prefix = window.t ? window.t('boot.load_failed') : 'Không tải được dữ liệu';
        root.innerHTML = '<div style="padding:48px 24px;color:var(--neg);font-weight:700;text-align:center">' + prefix + ': ' + (err && err.message ? err.message : err) + '</div>';
      });
  })();
</script>
